[project]
name = "isb-events"
version = "0.1.0"
description = "Weekly digest of Islamabad events, scraped, deduplicated, and served over WhatsApp."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "curl_cffi>=0.7",
    "selectolax>=0.3.21",
    "pydantic>=2.7",
    "python-dateutil>=2.9",
    "rapidfuzz>=3.9",
    "typer>=0.12",
    "pyyaml>=6.0",
    "libsql-experimental>=0.0.36",
]

[project.scripts]
isb-events = "isb_events.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["isb_events"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]

[tool.vercel]
# Vercel's Python runtime serves one app per project and will not guess: several
# modules here define a name called `app` (the Typer CLI, our own bot.app), and
# it refuses to pick between them. This names the WSGI callable explicitly.
entrypoint = "api.webhook:app"
