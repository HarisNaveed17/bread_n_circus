# Registered event sources. `enabled: false` switches a source off without a
# code change. A slug with no registered scraper yet is skipped silently.
sources:
  - slug: blackhole
    name: The Black Hole
    url: https://theblackhole.pk/upcoming-events/
    enabled: true # flipped on in M1

  - slug: ticketwala
    name: Ticketwala
    url: https://ticketwala.pk
    enabled: false # flipped on in M2 (or replaced by its fallback)

