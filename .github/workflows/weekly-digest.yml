name: Weekly digest

# Scrapes the enabled sources and saves the rendered digest into the store.
#
# It deliberately does NOT send anything. Delivery is mid-migration from
# Telegram to WhatsApp (see CLAUDE.md § Delivery), and the WhatsApp bot reads
# the digest straight out of Turso — so populating that row is the whole job
# here, and delivery becomes purely additive later.

on:
  schedule:
    # Twice daily, ~11:17 and ~19:17 Asia/Karachi. GitHub cron is always UTC
    # (UTC+5 → 06:17 and 14:17); neither GitHub nor Pakistan observes DST, so
    # this doesn't drift.
    #
    # Deliberately not on the hour. GitHub's scheduler is best-effort and
    # queues everyone's cron at once at :00, so top-of-hour jobs are the most
    # delayed and the most often dropped outright — the 2026-08-29 05:00 run
    # never happened. An odd minute sits in a quieter slot. Still best-effort,
    # not a guarantee; twice a day just means a dropped firing costs hours
    # instead of a week.
    - cron: "17 6 * * *"
    - cron: "17 14 * * *"
  workflow_dispatch:
    inputs:
      week_of:
        description: "Monday of the target week (YYYY-MM-DD). Blank = this week and the next."
        required: false
        type: string

concurrency:
  group: weekly-digest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      # Read via the environment, never interpolated into a run block —
      # `${{ inputs.* }}` inline in a shell script is a script-injection hole.
      WEEK_OF: ${{ inputs.week_of }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        # --extra pipeline: the base dependency set is the WhatsApp bot's, so
        # that Vercel does not ship scrapers and a compiled libSQL driver into
        # a serverless function. The scrapers live in the extra, and the cron
        # is the thing that needs them.
        run: uv sync --frozen --extra pipeline

      - name: Fail fast if the store is not configured
        run: |
          if [ -z "$TURSO_DATABASE_URL" ]; then
            echo "::error::TURSO_DATABASE_URL is unset. Without it the store" \
                 "falls back to a local sqlite file that dies with the runner," \
                 "so the run would look green but persist nothing."
            exit 1
          fi

      - name: Scrape and save the digest
        # A bare `render` refreshes the current week *and* the coming one. That
        # matters now the cron runs daily: `coming_week` is next week from
        # Tuesday on, so rendering only that would leave today's and tomorrow's
        # listings — what the bot's day views read — frozen until Monday.
        run: |
          if [ -n "$WEEK_OF" ]; then
            uv run isb-events render --week-of "$WEEK_OF"
          else
            uv run isb-events render
          fi

      - name: Show the digest in the run summary
        run: |
          # `tee`, not `>`: the summary page is nicer to read, but the step log
          # is what survives, what `gh run view --log` can reach, and what can
          # be grepped later. Writing only to the summary made a silent success
          # indistinguishable from an empty one.
          #
          # pipefail because the pipe would otherwise report tee's exit status
          # and swallow a Python traceback entirely.
          set -o pipefail
          uv run python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import os
          from datetime import date

          from isb_events.models import DigestWindow
          from isb_events.store import Store

          # The same weeks `render` just wrote: an explicit one, or the current
          # week and the coming one. Reporting only `coming_week` would leave
          # the run summary silent about the week today actually falls in.
          week_of = os.environ.get("WEEK_OF") or ""
          if week_of:
              windows = [DigestWindow.week_of(date.fromisoformat(week_of))]
          else:
              current, coming = DigestWindow.current_week(), DigestWindow.coming_week()
              windows = [current] if current == coming else [current, coming]

          # Scheme only — never the host or the token.
          url = os.environ.get("TURSO_DATABASE_URL") or ""
          backend = url.split("://")[0] + "://" if "://" in url else "local sqlite file"
          with Store.open() as store:
              rows = {w.start.date(): store.get_digest(w.start.date()) for w in windows}
              weeks = [r[0] for r in store._conn.execute(
                  "SELECT week_of FROM digests ORDER BY week_of DESC LIMIT 5"
              ).fetchall()]
              day_rows = store._conn.execute(
                  "SELECT event_date, COUNT(*) FROM digest_events GROUP BY event_date"
                  " ORDER BY event_date"
              ).fetchall()

          print(f"- store: {backend}")
          print(f"- weeks present in `digests`: {weeks or 'none'}")
          # The day views are what "what's on today" reads; a render that wrote
          # a digest but no per-day rows is the failure worth seeing here.
          print(f"- day views: {', '.join(f'{d} ({n})' for d, n in day_rows) or 'none'}")
          print()

          missing = [str(w) for w, row in rows.items() if row is None]
          if missing:
              # The render step reported success, so an empty read here means
              # the two steps did not agree on a database or on a week.
              print(f"**No digest row for {', '.join(missing)}.**")
              raise SystemExit(1)

          for week_start, row in rows.items():
              text = row["rendered_text"]
              print(f"### Digest for week of {week_start}")
              print()
              print(f"- {len(text)} chars, {text.count(chr(10) * 2) + 1} blocks")
              print()
              print("```")
              print(text)
              print("```")
              print()
          PY
