name: Weekly digest

# Scrapes the enabled sources and saves the rendered digest into the store.
#
# It deliberately does NOT send anything. Delivery is mid-migration from
# Telegram to WhatsApp (see CLAUDE.md § Delivery), and the WhatsApp bot reads
# the digest straight out of Turso — so populating that row is the whole job
# here, and delivery becomes purely additive later.

on:
  schedule:
    # Twice daily, ~11:17 and ~19:17 Asia/Karachi. GitHub cron is always UTC
    # (UTC+5 → 06:17 and 14:17); neither GitHub nor Pakistan observes DST, so
    # this doesn't drift.
    #
    # Deliberately not on the hour. GitHub's scheduler is best-effort and
    # queues everyone's cron at once at :00, so top-of-hour jobs are the most
    # delayed and the most often dropped outright — the 2026-08-29 05:00 run
    # never happened. An odd minute sits in a quieter slot. Still best-effort,
    # not a guarantee; twice a day just means a dropped firing costs hours
    # instead of a week.
    - cron: "17 6 * * *"
    - cron: "17 14 * * *"
  workflow_dispatch:
    inputs:
      week_of:
        description: "Monday of the target week (YYYY-MM-DD). Blank = this week and the next."
        required: false
        type: string
      skip_fetch:
        description: "Skip the scrape: just drain forwarded listings and re-render."
        required: false
        type: boolean
        default: false

concurrency:
  group: weekly-digest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      # `render` drains the curator intake queue before rendering. Unset, that
      # step logs and is skipped — the scraped sources still produce a digest,
      # so a missing key degrades intake rather than the run.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Read via the environment, never interpolated into a run block —
      # `${{ inputs.* }}` inline in a shell script is a script-injection hole.
      WEEK_OF: ${{ inputs.week_of }}
      # The bot sets this when a curator forwards a listing: drain the queue and
      # re-render, without asking every source for a fresh scrape. See the
      # render step below.
      SKIP_FETCH: ${{ inputs.skip_fetch }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        # --extra pipeline: the base dependency set is the WhatsApp bot's, so
        # that Vercel does not ship scrapers and a compiled libSQL driver into
        # a serverless function. The scrapers live in the extra, and the cron
        # is the thing that needs them.
        run: uv sync --frozen --extra pipeline

      - name: Fail fast if the store is not configured
        run: |
          if [ -z "$TURSO_DATABASE_URL" ]; then
            echo "::error::TURSO_DATABASE_URL is unset. Without it the store" \
                 "falls back to a local sqlite file that dies with the runner," \
                 "so the run would look green but persist nothing."
            exit 1
          fi
          # Store.open() prefers an explicit ISB_DB_PATH over Turso, so on a
          # runner it would write the whole digest to a file that vanishes with
          # the job — green run, nothing persisted, same symptom as above.
          if [ -n "${ISB_DB_PATH:-}" ]; then
            echo "::error::ISB_DB_PATH is set ($ISB_DB_PATH). It takes priority" \
                 "over Turso, so this run would persist to a file that dies with" \
                 "the runner. Unset it."
            exit 1
          fi

      - name: Scrape and save the digest
        # A bare `render` refreshes the current week *and* the coming one. That
        # matters now the cron runs daily: `coming_week` is next week from
        # Tuesday on, so rendering only that would leave today's and tomorrow's
        # listings — what the bot's day views read — frozen until Monday.
        #
        # `--no-fetch` is the curator path: a forwarded listing has to reach the
        # digest in minutes, and re-scraping every source to publish one event
        # is what would rate-limit theblackhole.pk. The scheduled runs keep the
        # scraped sources current; this only adds what was just handed to us.
        run: |
          args=()
          if [ -n "$WEEK_OF" ]; then args+=(--week-of "$WEEK_OF"); fi
          if [ "$SKIP_FETCH" = "true" ]; then args+=(--no-fetch); fi
          echo "render ${args[*]:-(no arguments)}"
          uv run isb-events render ${args[@]+"${args[@]}"}

      - name: Check the store and show the digest in the run summary
        # `isb-events check` reads the store back the way the bot will and
        # fails if the data says the pipeline has stopped: no digest for this
        # week, a source that has not contributed in 36h, an empty upcoming
        # window, or a forwarded listing stuck in the queue. The render step
        # above cannot tell — a source answering with an empty 200 is not an
        # error, and the digest still renders from the store. See
        # isb_events/check.py.
        #
        # `tee`, not `>`: the summary page is nicer to read, but the step log
        # is what survives and what `gh run view --log` can reach. pipefail so
        # the check's exit status wins over tee's.
        run: |
          set -o pipefail
          if [ -n "$WEEK_OF" ]; then
            uv run isb-events check --digest --week-of "$WEEK_OF" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            uv run isb-events check --digest | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Heartbeat
        # Dead man's switch. A scheduled workflow that never fires produces no
        # failed run to be notified about, so nothing inside GitHub can report
        # it. Pinging an external monitor on every *successful* check turns
        # silence into an alert: the monitor expects a ping within its grace
        # period and emails when one does not arrive. Healthchecks.io's free
        # tier is enough. Optional — with the secret unset, nothing is pinged.
        if: success()
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: |
          if [ -n "$HEARTBEAT_URL" ]; then
            curl -fsS -m 10 --retry 3 -o /dev/null "$HEARTBEAT_URL" && echo "heartbeat sent"
          else
            echo "HEARTBEAT_URL unset; no heartbeat sent"
          fi
